# clipQ + Caddy (automatic HTTPS). Settings come from .env next to this file; see DEPLOY.md.

services:
  clipq:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DB_PATH: /app/data/clipq.db
    volumes:
      - clipq-data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - clipq
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  clipq-data:
  caddy-data:
  caddy-config:
